name: Build and offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for the controller helper
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Compile application and controller helper
        run: |
          ./Build.bat --with-controller --no-pause
          if ($LASTEXITCODE -ne 0) { throw 'Build.bat failed.' }
      - name: Run all offline checks
        run: |
          ./Test-All.ps1
          'Compilation and synthetic checks only. No driver or real controller was started.' >> $env:GITHUB_STEP_SUMMARY
      - name: Check helper protocol and report pacing
        working-directory: src/ViiperOutputHost
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
        run: |
          go test -mod=vendor -count=1 ./cmd/tk75-output-host
          if ($LASTEXITCODE -ne 0) { throw 'Helper checks failed.' }
      - name: Package and verify exact build versions
        id: package
        run: |
          $packageVersion = (Get-Content -LiteralPath RELEASE_VERSION.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(-(preview|rc)\.\d+)?$') { throw 'Invalid package version.' }
          ./scripts/Package-Release.ps1 -Version $packageVersion
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
      - name: Save checked source and Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnalogKeyMapper-checked-packages
          path: |
            release/${{ steps.package.outputs.version }}/AnalogKeyMapper-${{ steps.package.outputs.version }}-source.zip
            release/${{ steps.package.outputs.version }}/AnalogKeyMapper-${{ steps.package.outputs.version }}-windows-x64.zip
            release/${{ steps.package.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: checked-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out the exact checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify and publish the checked release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-CheckedRelease.ps1
